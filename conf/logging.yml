version: 1
disable_existing_loggers: false

formatters:
  detailed:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(pathname)s:%(lineno)d - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: coffee_helper.log
    maxBytes: 10485760
    backupCount: 3
    encoding: utf8

root:
  level: DEBUG
  handlers: [file]

loggers:
  coffee_helper_cli:
    level: DEBUG
    handlers: [file]
    propagate: false
